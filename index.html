<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula Digital</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#1e2235;--mut:#7a8099;--pr:#5b5bf0;--pr2:#8a5cf6;--bd:#e6e8f3;--in:#f7f8fd;--sh:0 4px 20px rgba(60,70,140,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--tx:#e9ebf6;--mut:#8f96b3;--pr:#7c7cff;--pr2:#a37dff;--bd:#272c44;--in:#12162a;--sh:0 4px 20px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
.layout{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:linear-gradient(180deg,#2b2d6e,#4a2fa0);color:#fff;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-size:19px;font-weight:700;padding:6px 10px 18px}.brand small{display:block;font-weight:400;font-size:12px;opacity:.7}
nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
nav button{background:none;border:0;color:#d9dcff;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font:inherit;transition:.15s}
nav button:hover{background:rgba(255,255,255,.1)}nav button.on{background:#fff;color:#3b2fa0;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user{padding:12px 10px;border-top:1px solid rgba(255,255,255,.15);font-size:13px}.user button{margin-top:8px;width:100%;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:7px;cursor:pointer}
.content{flex:1;min-width:0}header{padding:26px 28px 0}header h1{margin:0;font-size:26px;letter-spacing:-.5px}
main{max-width:1060px;padding:18px 28px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--sh);overflow-x:auto}
.card h3{margin:0 0 12px;font-size:17px}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(91,91,240,.18)}textarea{width:100%;min-height:120px;resize:vertical}
button.b{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:10px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 4px 12px rgba(91,91,240,.35);transition:.15s}button.b:hover{transform:translateY(-1px)}
button.g{background:none;border:0;color:var(--pr);cursor:pointer;font:inherit;padding:4px 8px;border-radius:6px}button.g:hover{background:var(--in)}
table{border-collapse:collapse;width:100%}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600}
td,th{padding:10px;border-bottom:1px solid var(--bd);text-align:left}tr:hover td{background:var(--in)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar{background:linear-gradient(90deg,var(--pr),var(--pr2));height:12px;border-radius:99px;margin:4px 0 12px}
.out{white-space:pre-wrap}.hi{color:#e5484d;font-weight:700}.mut{color:var(--mut)}
.cell{cursor:pointer;min-width:100px;font-size:12px;border:1px dashed var(--bd);border-radius:8px}.cell:hover{background:var(--in)}
.stat{font-size:34px;font-weight:700;background:linear-gradient(135deg,var(--pr),var(--pr2));-webkit-background-clip:text;color:transparent}
body.auth{background:linear-gradient(135deg,#2b2d6e,#6a3fd6 55%,#c06cf0);display:grid;place-items:center;min-height:100vh}
#login{width:min(380px,92vw);padding:34px;text-align:center}#login .logo{font-size:46px}#login h2{margin:6px 0 4px}#login input{width:100%;margin:6px 0}#login button{width:100%;margin-top:10px}
#err{color:#e5484d;font-size:13px;min-height:18px;margin-top:8px}
@media(max-width:760px){.layout{flex-direction:column}aside{width:100%;height:auto;position:static;padding:10px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}.user{display:none}header{padding:16px}main{padding:12px 16px}}
</style></head><body><div id="app"></div><script>
let T=localStorage.t,U=null;const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'){logout();return}if(!r.ok)throw new Error(d.error||'Error');return d};
const go=async f=>{try{await f()}catch(e){alert(e.message)}};
const logout=()=>{localStorage.removeItem('t');T=null;login()};
function login(){document.body.className='auth';$('#app').innerHTML=`<div id="login" class="card"><div class="logo">🎓</div><h2>Aula Digital</h2><p class="mut">Ingresá con tu usuario</p><input id="u" placeholder="Usuario" autocomplete="username"><input id="p" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="b" id="go">Ingresar</button><div id="err"></div></div>`;
 const f=async()=>{$('#err').textContent='';try{const d=await api('login','POST',{username:$('#u').value.trim(),password:$('#p').value});T=d.token;localStorage.t=T;U=d.user;shell()}catch(e){$('#err').textContent=e.message==='Failed to fetch'||e instanceof SyntaxError?'No se pudo conectar con el servidor. Abrí http://localhost:3000 con "npm start" en marcha.':e.message}};
 $('#go').onclick=f;$('#p').onkeydown=e=>e.key==='Enter'&&f()}
const V={dashboard:['Panel',dash],alumnos:['Alumnos',alumnos],asistencia:['Asistencia',asist],notas:['Notas',notas],horarios:['Horarios',horarios],ia:['IA docente',ia],materiales:['Materiales',mats],alertas:['Alertas',alertas],usuarios:['Usuarios',usuarios]};
async function shell(){document.body.className='';if(!U)U=await api('me');if(!U)return;
 const ic={dashboard:'📊',alumnos:'🧑‍🎓',asistencia:'✅',notas:'📝',horarios:'🗓️',ia:'✨',materiales:'📁',alertas:'🚨',usuarios:'🔑'};
 $('#app').innerHTML=`<div class="layout"><aside><div class="brand">🎓 Aula Digital<small>Gestión escolar</small></div><nav>${Object.entries(V).filter(([k])=>k!=='usuarios'||U.role==='admin').map(([k,v])=>`<button data-k="${k}">${ic[k]}&nbsp; ${v[0]}</button>`).join('')}</nav><div class="user"><b>${esc(U.name)}</b><br><span style="opacity:.7">${U.role==='admin'?'Administrador':'Docente'}</span><button id="out">Cerrar sesión</button></div></aside><div class="content"><header><h1 id="ttl"></h1></header><main id="m"></main></div></div>`;
 document.querySelectorAll('nav [data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#ttl').textContent=V[b.dataset.k][0];go(V[b.dataset.k][1])});
 $('#out').onclick=logout;document.querySelector('[data-k=dashboard]').click()}
const courses=async()=>[...new Set((await api('students')).map(s=>s.course).filter(Boolean))];
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
async function dash(){const d=await api('dashboard');const gr=Object.entries(d.grades).map(([k,v])=>[k,+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)]);
 $('#m').innerHTML=`<div class="card"><div class="mut">Alumnos registrados</div><div class="stat">${d.students}</div></div><div class="card"><h3>Presentismo por curso (%)</h3>${d.attendance.map(a=>`<div>${esc(a.label)} — ${a.value}%<div class="bar" style="width:${a.value}%"></div></div>`).join('')||'<p class="mut">Sin datos aún</p>'}</div>
 <div class="card"><h3>Promedio por materia</h3>${gr.map(([k,v])=>`<div>${esc(k)} — ${v}<div class="bar" style="width:${v*10}%"></div></div>`).join('')||'<p class="mut">Sin datos aún</p>'}</div>`}
async function alumnos(){const l=await api('students');
 $('#m').innerHTML=`<div class="card"><h3>Nuevo alumno</h3><div class="row"><input id="n" placeholder="Nombre y apellido"><input id="d" placeholder="DNI"><input id="c" placeholder="Curso (ej. 3°A)"></div>
 <div class="row"><input id="al" placeholder="Alergias"><input id="ad" placeholder="Adaptaciones curriculares"><input id="h" placeholder="Historial académico"></div><button class="b" id="add">Agregar</button>
 <hr><p class="mut">Importar CSV (columnas: nombre, dni, curso, alergias, adaptaciones, historial)</p><input type="file" id="f" accept=".csv,.txt"></div>
 <div class="card"><table><tr><th>Nombre</th><th>DNI</th><th>Curso</th><th>Alergias</th><th>Adaptaciones</th><th>Historial</th><th></th></tr>${l.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.dni)}</td><td>${esc(s.course)}</td><td>${esc(s.allergies)}</td><td>${esc(s.adaptations)}</td><td>${esc(s.history)}</td><td><button class="g" data-e="${s.id}">Editar</button><button class="g" data-x="${s.id}">Borrar</button></td></tr>`).join('')}</table></div>`;
 $('#add').onclick=()=>go(async()=>{await api('students','POST',{name:$('#n').value,dni:$('#d').value,course:$('#c').value,allergies:$('#al').value,adaptations:$('#ad').value,history:$('#h').value});alumnos()});
 $('#f').onchange=e=>{const r=new FileReader();r.onload=()=>go(async()=>{const ls=r.result.split(/\r?\n/).filter(x=>x.trim()),sep=ls[0].includes(';')?';':',';
  const hd=ls[0].split(sep).map(x=>x.trim().toLowerCase());const k=(row,...n)=>{for(const x of n){const i=hd.indexOf(x);if(i>=0)return(row[i]||'').trim()}return''};
  const rows=ls.slice(1).map(x=>x.split(sep)).map(c=>({name:k(c,'nombre','name'),dni:k(c,'dni'),course:k(c,'curso','course'),allergies:k(c,'alergias'),adaptations:k(c,'adaptaciones'),history:k(c,'historial')}));
  const d=await api('students','POST',rows);alert(d.ok+' filas importadas');alumnos()});r.readAsText(e.target.files[0])};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm('¿Borrar?')&&go(async()=>{await api('students/'+b.dataset.x,'DELETE');alumnos()}));
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>go(async()=>{const s=l.find(x=>x.id==b.dataset.e);const p=(t,v)=>prompt(t,v);
  const n={...s,name:p('Nombre',s.name),dni:p('DNI',s.dni),course:p('Curso',s.course),allergies:p('Alergias',s.allergies),adaptations:p('Adaptaciones',s.adaptations),history:p('Historial',s.history)};
  await api('students/'+s.id,'PUT',n);alumnos()}))}
async function asist(){const cs=await courses();
 $('#m').innerHTML=`<div class="card"><div class="row"><select id="c">${opts(cs)}</select><input type="date" id="dt" value="${new Date().toISOString().slice(0,10)}"><button class="b" id="ld">Cargar</button></div><div id="t"></div></div>`;
 $('#ld').onclick=()=>go(async()=>{const l=await api(`attendance?course=${encodeURIComponent($('#c').value)}&date=${$('#dt').value}`);
  $('#t').innerHTML=`<table>${l.map(s=>`<tr data-id="${s.id}"><td>${esc(s.name)}</td><td><select>${[['P','Presente'],['A','Ausente'],['T','Tardanza']].map(([v,t])=>`<option value="${v}" ${(s.status||'P')===v?'selected':''}>${t}</option>`).join('')}</select></td><td><input placeholder="Justificación" value="${esc(s.note)}"></td></tr>`).join('')}</table><button class="b" id="sv">Guardar</button>`;
  $('#sv').onclick=()=>go(async()=>{await api('attendance','POST',{date:$('#dt').value,records:[...document.querySelectorAll('#t tr')].map(r=>({id:r.dataset.id,status:r.querySelector('select').value,note:r.querySelector('input').value}))});alert('Guardado')})});}
async function notas(){const cs=await courses();
 $('#m').innerHTML=`<div class="card"><div class="row"><select id="c">${opts(cs)}</select><input id="s" placeholder="Materia"><button class="b" id="ld">Cargar</button></div><div id="t"></div></div>`;
 $('#ld').onclick=()=>go(async()=>{const subj=$('#s').value,l=await api(`gradebook?course=${encodeURIComponent($('#c').value)}&subject=${encodeURIComponent(subj)}`);
  $('#t').innerHTML=`<div class="row"><input id="ti" placeholder="Título (ej. TP 1)"><select id="sc"><option value="numerica">Numérica (1-10)</option><option value="conceptual">Conceptual (MB/B/R/I)</option></select></div>
  <table><tr><th>Alumno</th><th>Notas</th><th>Promedio</th><th>Nueva</th></tr>${l.map(s=>`<tr data-id="${s.id}"><td>${esc(s.name)}</td><td>${s.grades.map(g=>`<span title="${esc(g.title)}">${esc(g.value)}<a href="#" data-g="${g.id}" style="color:#d33;text-decoration:none"> ×</a></span>`).join(' | ')}</td><td><b>${s.avg??'-'}</b></td><td><input size="4"></td></tr>`).join('')}</table><button class="b" id="sv">Guardar notas</button>`;
  $('#sv').onclick=()=>go(async()=>{await api('grades','POST',{subject:subj,title:$('#ti').value||'Nota',scale:$('#sc').value,grades:[...document.querySelectorAll('#t tr[data-id]')].map(r=>({student_id:r.dataset.id,value:r.querySelector('input').value.trim()}))});$('#ld').click()});
  document.querySelectorAll('[data-g]').forEach(a=>a.onclick=e=>{e.preventDefault();go(async()=>{await api('grades/'+a.dataset.g,'DELETE');$('#ld').click()})})})}
async function horarios(){const[cs,us,sc]=await Promise.all([courses(),api('users'),api('schedule')]);const D=['Lun','Mar','Mié','Jue','Vie'];
 $('#m').innerHTML=`<div class="card"><div class="row"><select id="c">${opts(cs)}</select><span class="mut">${U.role==='admin'?'Clic en una celda para asignar/quitar':'Solo el administrador edita'}</span></div><div id="t"></div></div>`;
 const draw=()=>{const c=$('#c').value;$('#t').innerHTML=`<table><tr><th></th>${D.map(d=>`<th>${d}</th>`).join('')}</tr>${[1,2,3,4,5,6,7,8].map(h=>`<tr><th>${h}ª</th>${D.map((_,i)=>{const x=sc.find(z=>z.course===c&&z.day===i+1&&z.slot===h);return`<td class="cell" data-d="${i+1}" data-h="${h}" data-id="${x?.id||''}">${x?`<b>${esc(x.subject)}</b><br>${esc(x.teacher)}`:''}</td>`}).join('')}</tr>`).join('')}</table>`;
  if(U.role==='admin')document.querySelectorAll('.cell').forEach(t=>t.onclick=()=>go(async()=>{
   if(t.dataset.id){if(confirm('¿Quitar?'))await api('schedule/'+t.dataset.id,'DELETE')}else{const subject=prompt('Materia');if(!subject)return;
    const n=prompt('Docente (número):\n'+us.map((u,i)=>`${i+1}) ${u.name}`).join('\n'));const u=us[n-1];if(!u)return;
    await api('schedule','POST',{course:c,day:+t.dataset.d,slot:+t.dataset.h,subject,teacher_id:u.id})}
   sc.splice(0,sc.length,...await api('schedule'));draw()}))};
 $('#c').onchange=draw;draw()}
async function ia(){const ms=await api('materials');
 $('#m').innerHTML=`<div class="card"><div class="row"><select id="tool"><option value="planificacion">Planificación de clases</option><option value="flashcards">Flashcards</option><option value="evaluacion">Evaluación (desde programa)</option><option value="adaptacion">Adaptar texto</option></select>
 <select id="lv"><option value="">Nivel (solo adaptación)</option><option>nivel inicial / lectura fácil</option><option>primaria</option><option>secundaria</option><option>educación especial, frases cortas y pictogramas sugeridos</option></select>
 <select id="ld"><option value="">Cargar material guardado…</option>${ms.map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select></div>
 <textarea id="in" placeholder="Tema, curso, duración, objetivos… o pegá el texto/programa"></textarea><div class="row"><button class="b" id="gen">Generar</button></div><div class="card out" id="o"></div><div class="row"><input id="tt" placeholder="Título para guardar"><button class="b" id="sv">Guardar en materiales</button></div></div>`;
 $('#ld').onchange=()=>{const m=ms.find(x=>x.id==$('#ld').value);if(m)$('#in').value=m.content};
 $('#gen').onclick=()=>go(async()=>{$('#o').textContent='Generando…';const lv=$('#lv').value;const d=await api('ai/'+$('#tool').value,'POST',{input:($('#tool').value==='adaptacion'&&lv?'Nivel destino: '+lv+'\n':'')+$('#in').value});$('#o').textContent=d.text});
 $('#sv').onclick=()=>go(async()=>{await api('materials','POST',{title:$('#tt').value||'Sin título',type:$('#tool').value,content:$('#o').textContent});alert('Guardado');ia()})}
async function mats(){const ms=await api('materials');
 $('#m').innerHTML=ms.map(m=>`<div class="card"><b>${esc(m.title)}</b> <span class="mut">${esc(m.type)} · ${esc(m.created)}</span><div class="out">${esc(m.content.slice(0,400))}…</div><button class="g" data-p="${m.id}">Imprimir/PDF</button><button class="g" data-x="${m.id}">Borrar</button></div>`).join('')||'<p class="mut">Aún no hay materiales</p>';
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>go(async()=>{await api('materials/'+b.dataset.x,'DELETE');mats()}));
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const m=ms.find(x=>x.id==b.dataset.p),w=open('');w.document.write(`<pre style="font:14px sans-serif;white-space:pre-wrap"><h2>${esc(m.title)}</h2>${esc(m.content)}</pre>`);w.print()})}
async function alertas(){const l=await api('risk');
 $('#m').innerHTML=`<div class="card"><h3>Alertas tempranas</h3><p class="mut">Se calculan con asistencia (&gt;20% de faltas) y promedio (&lt;6).</p><table>${l.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.course)}</td><td class="${r.level==='Alto'?'hi':''}">${r.level}</td><td>${r.factors.join(', ')}</td></tr>`).join('')||'<tr><td>Sin alumnos en riesgo</td></tr>'}</table></div>`}
async function usuarios(){const l=await api('users');
 $('#m').innerHTML=`<div class="card"><h3>Nuevo usuario</h3><div class="row"><input id="n" placeholder="Nombre"><input id="u" placeholder="Usuario"><input id="p" placeholder="Contraseña"><select id="r"><option value="docente">Docente</option><option value="admin">Administrador</option></select><button class="b" id="add">Crear</button></div></div>
 <div class="card"><table>${l.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role}</td><td><button class="g" data-k="${u.id}">Cambiar clave</button><button class="g" data-x="${u.id}">Borrar</button></td></tr>`).join('')}</table></div>`;
 $('#add').onclick=()=>go(async()=>{await api('users','POST',{name:$('#n').value,username:$('#u').value,password:$('#p').value,role:$('#r').value});usuarios()});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm('¿Borrar?')&&go(async()=>{await api('users/'+b.dataset.x,'DELETE');usuarios()}));
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(async()=>{const p=prompt('Nueva contraseña');if(p){await api(`users/${b.dataset.k}/password`,'PUT',{password:p});alert('Listo')}}))}
T?shell():login();
</script></body></html>
