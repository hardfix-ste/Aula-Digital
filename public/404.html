<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AULA DIGITAL</title>
  <script>
    // GitHub Pages no conoce las rutas de la SPA: este 404 redirige a index.html
    // conservando la ruta (técnica spa-github-pages).
    // pathSegmentsToKeep = 1 para sitios de proyecto (usuario.github.io/REPO/).
    // Ponelo en 0 si usás un dominio propio o un repositorio usuario.github.io.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
